<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>じゃんけん</title>
</head>

<body>

<header>
  <img src="https://www.popgallery.jp/img/goods/L/catalog_l/BJ81169.jpg" alt="幕">
  <h1>じゃんけん大会</h1>
</header>

<main>
    <!-- <ul> -->
        <div class="selection">
            <div>
                <li id="gu_btn">グー
                    <img src="https://illustcenter.com/wp-content/uploads/2022/05/rdesign_14296.png" alt="グー">
                </li>
            </div>
            <div>
                <li id="cho_btn">チョキ
                    <img src="https://illustcenter.com/wp-content/uploads/2022/05/rdesign_14297.png" alt="チョキ">
                </li>
            </div>
            <div>
                <li id="par_btn">パー
                    <img src="https://illustcenter.com/wp-content/uploads/2022/05/rdesign_14298.png" alt="パー">
                </li>
            </div>
        </div>
    <!-- </ul> -->
  <div class="computer">
    コンピュータの出した手は？「<span id="pc_hands">なに？</span>」
    <img id="computer1" src="img/ChatGPT Image 2025年11月12日 19_15_54.png" alt="判定前">
  </div>
  <div id="judgment">判定</div>

    <div class="outcome">
        <div >勝利
            <li id="win_counter">0
            </li>
        </div>
        <div >敗北
            <li id="lose_counter">0
            </li>
        </div>
    </div>
</main>

<footer>
<img src="https://www.popgallery.jp/img/goods/L/catalog_l/BJ81169.jpg" alt="幕">
</footer>


<script>
let winc=0
let losec=0
//じゃんけん用のSCRIPTを書いてください
$("#gu_btn" ).on("click",function(){
    const pc_hands = Math.ceil(Math.random()*3); //繰り上げ関数
    // 以下　おみくじ分岐処理
    if(pc_hands == 1){
        $("#pc_hands").html("グー");
        $("#judgment").html("あいこ");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_03.png");
    }

    if(pc_hands == 2){
        $("#pc_hands").html("チョキ");
        $("#judgment").html("あなたの勝ち!!");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_06.png");
        winc +=1
        $("#win_counter").html(winc)
    }
    
    if(pc_hands == 3){
        $("#pc_hands").html("パー");
        $("#judgment").html("あなたの負け");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_15_58.png");
        losec +=1
        $("#lose_counter").html(losec)

    }
});

$("#cho_btn" ).on("click",function(){
    const pc_hands = Math.ceil(Math.random()*3); //繰り上げ関数
    // 以下　おみくじ分岐処理
    if(pc_hands == 1){
        $("#pc_hands").html("グー");
        $("#judgment").html("あなたの負け");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_03.png");
        losec +=1;
        $("#lose_counter").html(losec) ;             
    }
  
    if(pc_hands == 2){
        $("#pc_hands").html("チョキ");
        $("#judgment").html("あいこ");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_06.png");
    }
  
    if(pc_hands == 3){
        $("#pc_hands").html("パー");
        $("#judgment").html("あなたの勝ち!!");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_15_58.png");
        winc +=1;
        $("#win_counter").html(winc) ;    
    }
});

$("#par_btn" ).on("click",function(){
    const pc_hands = Math.ceil(Math.random()*3); //繰り上げ関数
    // 以下　おみくじ分岐処理
    if(pc_hands == 1){
        $("#pc_hands").html("グー");
        $("#judgment").html("あなたの勝ち!!");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_03.png");
        winc +=1;
        $("#win_counter").html(winc) ;             
    }
  
    if(pc_hands == 2){
        $("#pc_hands").html("チョキ");
        $("#judgment").html("あなたの負け");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_01_06.png");
        losec +=1;
        $("#lose_counter").html(losec);
    }
  
    if(pc_hands == 3){
        $("#pc_hands").html("パー");
        $("#judgment").html("あいこ");
        $("#computer1").attr("src","img/ChatGPT Image 2025年11月12日 19_15_58.png");
    }
});    
</script>
</body>

</html>
